<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="header">
        <div class="container header-inner">
            <div>
                <h1>Expense Tracker</h1>
                <p>Manage your expenses easily and efficiently.</p>
            </div>
            <div class="header-badge" aria-hidden="true">💰</div>
        </div>
    </header>

    <main class="container">

        <section class="summary" aria-label="Ringkasan keuangan">
            <div class="summary-card">
                <span>Total Balance</span>
                <h2 id="balance" data-testid="balance">Rp 0</h2>
            </div>

            <div class="summary-card summary-income">
                <span>Total Income</span>
                <h2 id="income" data-testid="income">Rp 0</h2>
            </div>

            <div class="summary-card summary-expense">
                <span>Total Expense</span>
                <h2 id="expense" data-testid="expense">Rp 0</h2>
            </div>
        </section>

        <section class="content">

            <div class="form-section">
                <h2>Add Transaction</h2>

                <form id="transaction-form" data-testid="transaction-form">

                    <div class="form-group">
                        <label for="description">Description</label>
                        <input
                            type="text"
                            id="description"
                            data-testid="description-input"
                            placeholder="Enter transaction description"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="amount">Amount</label>
                        <input
                            type="number"
                            id="amount"
                            data-testid="amount-input"
                            placeholder="Enter amount"
                            min="1"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="type">Type</label>
                        <select id="type" data-testid="type-input" required>
                            <option value="expense">Expense</option>
                            <option value="income">Income</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="category">Category</label>
                        <select id="category" data-testid="category-input" required>
                            <option value="">Select category</option>
                            <option value="Food">Food</option>
                            <option value="Transportation">Transportation</option>
                            <option value="Shopping">Shopping</option>
                            <option value="Bills">Bills</option>
                            <option value="Entertainment">Entertainment</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="date">Date</label>
                        <input
                            type="date"
                            id="date"
                            data-testid="date-input"
                            required
                        >
                    </div>

                    <button type="submit" class="btn" data-testid="submit-button">
                        Add Transaction
                    </button>

                </form>
            </div>

            <div class="transactions-section">
                <div class="section-header">
                    <h2>Transactions</h2>

                    <div class="toolbar">
                        <input
                            type="search"
                            id="search"
                            data-testid="search-input"
                            class="search-input"
                            placeholder="Search transactions..."
                            autocomplete="off"
                        >
                        <select id="filter" data-testid="filter-type" aria-label="Filter by type">
                            <option value="all">All</option>
                            <option value="income">Income</option>
                            <option value="expense">Expense</option>
                        </select>
                        <select id="category-filter" data-testid="filter-category" aria-label="Filter by category">
                            <option value="all">All Categories</option>
                            <option value="Food">Food</option>
                            <option value="Transportation">Transportation</option>
                            <option value="Shopping">Shopping</option>
                            <option value="Bills">Bills</option>
                            <option value="Entertainment">Entertainment</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                </div>

                <div id="transaction-list" data-testid="transaction-list" class="transaction-list">
                    <p class="empty-message">
                        No transactions yet.
                    </p>
                </div>
            </div>

        </section>

    </main>

    <footer class="footer">
        <p>Expense Tracker App</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
